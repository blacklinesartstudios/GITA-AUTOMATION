name: Autonomous Gita Video Bot

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore YouTube Tokens
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_TOKEN_PICKLE: ${{ secrets.YOUTUBE_TOKEN_PICKLE }}
        run: |
          python -c "
          import os, base64
          json_data = os.environ.get('YOUTUBE_TOKEN_JSON', '').strip()
          pickle_data = os.environ.get('YOUTUBE_TOKEN_PICKLE', '').strip()
          if json_data:
              with open('token.json', 'w') as f:
                  f.write(json_data)
              print('Successfully restored token.json')
          if pickle_data:
              with open('token.pickle', 'wb') as f:
                  f.write(base64.b64decode(pickle_data))
              print('Successfully restored token.pickle')
          "

      - name: Create required folders
        run: |
          mkdir -p output outputs cache catch temp

      - name: Run MASTER Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python MASTER.py
