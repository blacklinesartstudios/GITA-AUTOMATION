name: Bhagavad Gita YouTube Automation

on:
  workflow_dispatch:
  schedule:
    # 6:00 AM IST (00:30 UTC)
    - cron: '30 0 * * *'
    # 1:00 PM IST (07:30 UTC)
    - cron: '30 7 * * *'
    # 7:00 PM IST (13:30 UTC)
    - cron: '30 13 * * *'

permissions:
  contents: write

concurrency:
  group: gita-pipeline-production
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System FFmpeg & Devanagari Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-deva fonts-noto-core libraqm0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Pre-trust PyTorch Hub Repositories
        run: |
          mkdir -p /home/runner/.cache/torch/hub
          cat << 'EOF' > /home/runner/.cache/torch/hub/trusted_list
          intel-isl/MiDaS
          rwightman/gen-efficientnet-pytorch
          rwightman_gen-efficientnet-pytorch
          EOF

      - name: Restore YouTube Secrets and Tokens
        env:
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_TOKEN_PICKLE: ${{ secrets.YOUTUBE_TOKEN_PICKLE }}
        run: |
          python -c "
          import os, base64
          cs_data = os.environ.get('CLIENT_SECRETS_JSON', '').strip()
          json_data = os.environ.get('YOUTUBE_TOKEN_JSON', '').strip()
          pickle_data = os.environ.get('YOUTUBE_TOKEN_PICKLE', '').strip()
          if cs_data:
              with open('client_secrets.json', 'w') as f:
                  f.write(cs_data)
              print('Restored client_secrets.json')
          if json_data:
              with open('token.json', 'w') as f:
                  f.write(json_data)
              print('Restored token.json')
          if pickle_data:
              with open('token.pickle', 'wb') as f:
                  f.write(base64.b64decode(pickle_data))
              print('Restored token.pickle')
          "

      - name: Create required folders
        run: |
          mkdir -p output outputs cache catch temp depth

      - name: Randomize Upload Timing (Anti-Bot Fingerprint)
        run: |
          # Sleep for a random time between 0 and 60 minutes to act human
          DELAY=$((RANDOM % 3600))
          echo "Sleeping for $((DELAY / 60)) minutes before starting..."
          sleep $DELAY

      - name: Run MASTER Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python MASTER.py

      - name: Run YouTube Uploader
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python engine/uploader.py

      - name: Permanent Cloud Video Backup (GitHub Releases)
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="archive-$(date +'%Y%m%d-%H%M%S')"
          gh release create "$TAG_NAME" output/*.mp4 --title "Gita Video Backup ($TAG_NAME)" --notes "Permanent off-site archive of generated video by Blacklines Art Studios." || echo "Backup uploaded"

      - name: Auto-Save New Depth Maps & Progress to GitHub
        if: success()
        run: |
          git config --global user.name "Gita-Bot"
          git config --global user.email "bot@blacklinesart.com"
          git add depth/ tracker.json narration.txt 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Auto-save new depth maps and verse tracker [skip ci]" && git push origin main)
