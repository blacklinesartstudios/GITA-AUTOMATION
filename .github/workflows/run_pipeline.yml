name: Bhagavad Gita YouTube Automation

on:
  schedule:
    - cron: '30 0 * * *'
    - cron: '30 7 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch: 

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' 

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-deva

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Generate and Upload Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
        run: |
          # Runs MASTER.py from the main folder, then uploader.py from the engine folder
          python MASTER.py
          python engine/uploader.py

      - name: Commit Verse Progression Tracker
        if: success()
        run: |
          git config --global user.name "Gita-Bot"
          git config --global user.email "bot@blacklinesart.com"
          git add *.json cache/*.json depth/ 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Auto-save tracker progression [skip ci]" && git pull --rebase origin main && git push origin main)
