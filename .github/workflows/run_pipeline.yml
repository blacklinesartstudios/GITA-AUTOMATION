name: Autonomous Gita Video Bot

on:
  schedule:
    # Runs everyday at 00:30 UTC (6:00 AM IST)
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Restore token.json
        if: ${{ env.YOUTUBE_TOKEN_JSON != '' }}
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python -c "import os; open('token.json', 'w').write(os.environ['YOUTUBE_TOKEN_JSON'])"

      - name: Restore token.pickle
        if: ${{ env.YOUTUBE_TOKEN_PICKLE != '' }}
        env:
          YOUTUBE_TOKEN_PICKLE: ${{ secrets.YOUTUBE_TOKEN_PICKLE }}
        run: |
          python -c "import os, base64; open('token.pickle', 'wb').write(base64.b64decode(os.environ['YOUTUBE_TOKEN_PICKLE']))"

      - name: Run MASTER Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python MASTER.py
