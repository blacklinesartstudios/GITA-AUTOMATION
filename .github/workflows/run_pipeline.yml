name: Bhagavad Gita YouTube Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' # Executes daily at 04:00 UTC (09:30 AM IST)

concurrency:
  group: gita-pipeline-production
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install System FFmpeg & Devanagari Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-deva fonts-noto-core libraqm0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache PyTorch / MiDaS Models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/torch/hub
            ~/.cache/torch/hub/checkpoints
          key: ${{ runner.os }}-torch-models-v2
          restore-keys: |
            ${{ runner.os }}-torch-models-

      - name: Cache Persistent Depth Maps
        uses: actions/cache@v4
        with:
          path: depth
          key: ${{ runner.os }}-depth-maps-${{ hashFiles('assets/images/**') }}
          restore-keys: |
            ${{ runner.os }}-depth-maps-

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Master Script
        env:
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python MASTER.py

      - name: Publish Master Video to GitHub Releases
        if: success()
        run: |
          TAG_NAME="archive-$(date +'%Y%m%d-%H%M%S')"
          gh release create "$TAG_NAME" output/*.mp4 \
            --title "Daily Master Video $TAG_NAME" \
            --notes "Automated 3D Parallax Master Production by Blacklines Art Studio."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Verse Progression Tracker
        if: success()
        run: |
          git config --global user.name "Gita-Bot"
          git config --global user.email "bot@blacklinesart.com"
          git add tracker.json depth/ || true
          git commit -m "Auto-save tracker and new depth maps [skip ci]" || echo "No state changes to commit"
          git push origin main || true
