name: Bhagavad Gita YouTube Automation

on:
  schedule:
    # 6:00 AM IST (00:30 UTC)
    - cron: '30 0 * * *'
    # 1:00 PM IST (07:30 UTC)
    - cron: '30 7 * * *'
    # 7:00 PM IST (13:30 UTC)
    - cron: '30 13 * * *'
  workflow_dispatch: 

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' 

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-deva

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Generate and Upload Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
        run: |
          # 1. Run the engine to generate AI metadata, voice, and video
          python engine/master_engine.py
          
          # 2. Upload video as Private and schedule random YouTube publish time
          python engine/uploader.py

      - name: Commit Verse Progression Tracker
        if: success()
        run: |
          git config --global user.name "Gita-Bot"
          git config --global user.email "bot@blacklinesart.com"
          
          # Scans root and cache folders for JSON trackers so it never misses progress
          git add *.json cache/*.json depth/ 2>/dev/null || true
          
          git diff --staged --quiet || (git commit -m "Auto-save tracker progression [skip ci]" && git pull --rebase origin main && git push origin main)
